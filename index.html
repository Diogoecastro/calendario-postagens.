<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101114">
  <title>Estúdio Social — Calendário de conteúdo</title>
  <style>
    :root{color-scheme:dark;--bg:#101114;--panel:#191a1f;--panel2:#202127;--line:#303139;--text:#f3f2f0;--muted:#a3a3ad;--orange:#ff8534;--green:#5bd4a0;--red:#ff7272;--blue:#71aaff;--yellow:#ffd166;font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 85% -15%,#422313 0,transparent 36%),var(--bg);color:var(--text);min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer;color:inherit}.shell{max-width:1320px;margin:auto;padding:26px 28px 50px}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:26px}.brand{display:flex;align-items:center;gap:13px}.logo{width:44px;height:44px;border-radius:14px;background:var(--orange);color:#17120e;font-weight:900;display:grid;place-items:center;font-size:15px;box-shadow:0 8px 28px #ff853433}.eyebrow{color:var(--orange);font-size:11px;text-transform:uppercase;letter-spacing:.14em;font-weight:750}.brand h1{font-size:20px;line-height:1.1;margin:4px 0 0}.muted{color:var(--muted)}.top-actions,.toolbar,.month-nav,.views{display:flex;align-items:center;gap:9px}.button{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:9px 13px;font-size:13px;font-weight:650;transition:.15s}.button:hover{border-color:#595a63;transform:translateY(-1px)}.button.primary{background:var(--orange);border-color:var(--orange);color:#21150e}.button.ghost{background:transparent}.button.icon{width:36px;height:36px;padding:0;font-size:18px}.button.active{background:#442512;border-color:#80451f;color:#ffad75}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px}.stat{background:linear-gradient(140deg,#202126,#17181c);border:1px solid var(--line);border-radius:14px;padding:15px 16px}.stat-label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px}.dot{width:8px;height:8px;border-radius:50%;background:var(--tone)}.stat strong{font-size:26px;display:block;margin-top:7px;line-height:1}.tools{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}.month-nav strong{min-width:150px;text-align:center;text-transform:capitalize;font-size:16px}.search,.filter{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:9px 11px;color:var(--text);font-size:13px;outline:none}.search:focus,.filter:focus,.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--orange)}.search{width:220px}.views{padding:4px;border-radius:11px;border:1px solid var(--line);background:var(--panel)}.views .button{border:0;background:transparent;padding:7px 11px}.views .button.active{background:var(--panel2);color:#fff}.calendar{border:1px solid var(--line);border-radius:15px;overflow:hidden;background:#15161a}.weekdays,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}.weekdays{background:#1b1c20;border-bottom:1px solid var(--line)}.weekdays div{text-align:right;padding:10px 12px;color:var(--muted);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}.weekdays div:first-child,.weekdays div:last-child{color:#e89a69}.day{min-height:138px;border-right:1px solid #292a30;border-bottom:1px solid #292a30;padding:8px;transition:background .15s}.day:nth-child(7n){border-right:0}.day:hover{background:#1b1c20}.day.outside{opacity:.43}.day.today .day-number{background:var(--orange);color:#21150e}.day-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}.day-number{width:25px;height:25px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700}.add-day{opacity:0;border:0;border-radius:7px;background:#33343b;width:25px;height:25px}.day:hover .add-day{opacity:1}.post-chip{width:100%;text-align:left;padding:7px 8px;margin:3px 0 0;border:1px solid #414047;background:#24242a;border-left:3px solid var(--tone);border-radius:7px;font-size:11px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.post-chip:hover{background:#303037}.chip-time{color:#c0bdba;font-size:10px;margin-right:5px}.more{font-size:10px;color:var(--muted);padding:3px 5px}.kanban{display:grid;grid-template-columns:repeat(5,minmax(210px,1fr));gap:12px;overflow:auto;padding-bottom:8px}.column{border:1px solid var(--line);border-radius:13px;background:#17181c;min-height:400px;padding:11px}.col-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:4px 2px 11px;margin-bottom:9px;font-size:12px;font-weight:750}.count{color:var(--muted);background:#27282d;padding:2px 8px;border-radius:20px}.kanban-card{border:1px solid var(--line);background:#202126;border-radius:10px;padding:11px;margin-bottom:8px;cursor:pointer}.kanban-card:hover{border-color:#6c5141}.kanban-card strong{font-size:12px;display:block;margin-bottom:7px}.card-meta{color:var(--muted);font-size:11px;display:flex;justify-content:space-between}.tag{font-size:10px;padding:3px 7px;border-radius:20px;background:#34353c;color:#ddd}.empty{padding:22px 12px;text-align:center;color:#777;font-size:12px}.hidden{display:none!important}.modal-backdrop{position:fixed;inset:0;background:#000b;z-index:5;display:grid;place-items:center;padding:20px}.modal{width:min(720px,100%);max-height:92vh;overflow:auto;background:#191a1f;border:1px solid #3b3c44;border-radius:17px;box-shadow:0 24px 90px #0009}.modal-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#191a1f;z-index:1}.modal-head h2{font-size:17px;margin:0}.modal-body{padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:15px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:700;color:#d1d0d0}.field input,.field select,.field textarea{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:9px;background:#111216;color:var(--text);outline:none;font-size:13px}.field textarea{min-height:135px;resize:vertical}.modal-foot{padding:15px 20px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}.status-badge{font-size:10px;font-weight:750;color:var(--tone);text-transform:uppercase;letter-spacing:.06em}.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,30px);opacity:0;background:#24252b;border:1px solid #42434a;padding:10px 15px;border-radius:10px;font-size:13px;transition:.2s;pointer-events:none;z-index:10}.toast.show{transform:translate(-50%,0);opacity:1}.hint{font-size:11px;color:#85858e;margin-top:14px;text-align:center}.mobile-month{display:none}
    .upload-box{border:1px dashed #55565f;border-radius:11px;background:#131419;padding:15px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:.15s}.upload-box:hover{border-color:var(--orange);background:#1e1a17}.upload-icon{width:38px;height:38px;border-radius:10px;background:#322116;color:#ffad75;display:grid;place-items:center;font-size:20px;flex:none}.upload-copy strong{font-size:12px;display:block}.upload-copy span{font-size:11px;color:var(--muted)}.media-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:9px;margin-top:10px}.media-item{position:relative;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#101114;min-width:0}.media-item img,.media-item video{display:block;width:100%;height:110px;object-fit:cover}.media-name{font-size:10px;color:#ccc;padding:5px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.media-remove{position:absolute;right:5px;top:5px;border:0;border-radius:50%;background:#131419dd;color:white;width:24px;height:24px;font-size:15px}.media-empty{font-size:11px;color:#85858e;margin-top:8px}
    @media(max-width:900px){.shell{padding:20px 17px 40px}.stats{grid-template-columns:repeat(3,1fr)}.day{min-height:115px}.kanban{grid-template-columns:repeat(5,220px)}}
    @media(max-width:600px){.shell{padding:15px 11px 30px}.top{align-items:flex-start;margin-bottom:18px}.top-actions{gap:6px}.top-actions .button{padding:8px 9px}.top-actions .button span{display:none}.brand h1{font-size:17px}.brand .muted{font-size:11px}.stats{grid-template-columns:repeat(2,1fr);gap:8px}.stat{padding:11px}.stat strong{font-size:22px}.tools{flex-wrap:wrap}.month-nav{order:0}.search{order:1;flex:1;width:120px}.views{order:2}.filter{order:3;flex:1}.weekdays div{text-align:center;padding:8px 0;font-size:9px}.day{min-height:88px;padding:4px}.day-number{font-size:10px;width:22px;height:22px}.add-day{display:none}.post-chip{font-size:0;min-height:7px;padding:2px 3px;border-width:0 0 0 3px;margin-top:3px}.chip-time{display:none}.more{font-size:9px;padding:2px}.month-nav strong{font-size:14px;min-width:118px}.button.icon{width:32px;height:32px}.views .button{font-size:11px;padding:7px 8px}.modal-body{grid-template-columns:1fr;padding:15px}.field.full{grid-column:1}.modal-backdrop{padding:9px}.day:nth-child(7n){border-right:0}}
  </style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand"><div class="logo">DC</div><div><div class="eyebrow">Estúdio Social</div><h1>Calendário de conteúdo</h1><div class="muted" style="font-size:12px;margin-top:3px">Diogo Castro <span style="color:#64646b">·</span> planejamento & produção</div></div></div>
    <div class="top-actions"><button id="exportBtn" class="button ghost" title="Baixar cópia dos posts">⇩ <span>Exportar</span></button><button id="importBtn" class="button ghost" title="Restaurar uma cópia">⇧ <span>Importar</span></button><input id="importFile" type="file" accept="application/json" class="hidden"><button id="newPost" class="button primary">＋ <span>Novo post</span></button></div>
  </header>
  <section class="stats" id="stats"></section>
  <div class="tools">
    <div class="month-nav"><button class="button icon" id="prevMonth" aria-label="Mês anterior">‹</button><strong id="monthLabel"></strong><button class="button icon" id="nextMonth" aria-label="Próximo mês">›</button><button class="button ghost" id="todayBtn">Hoje</button></div>
    <input id="search" class="search" placeholder="⌕  Buscar posts…" aria-label="Buscar posts">
    <select id="formatFilter" class="filter" aria-label="Filtrar formato"><option value="all">Todos os formatos</option><option value="Carrossel">Carrossel</option><option value="Reels">Reels</option><option value="Feed 4:5">Feed 4:5</option><option value="Feed 1:1">Feed 1:1</option><option value="Stories">Stories</option></select>
    <div class="views"><button id="monthViewBtn" class="button active">Mês</button><button id="boardViewBtn" class="button">Quadro</button></div>
  </div>
  <section id="calendarView" class="calendar"><div class="weekdays"><div>Dom</div><div>Seg</div><div>Ter</div><div>Qua</div><div>Qui</div><div>Sex</div><div>Sáb</div></div><div id="calendarGrid" class="grid"></div></section>
  <section id="boardView" class="kanban hidden"></section>
  <div class="hint">Seus posts são salvos automaticamente neste navegador. Use Exportar para guardar uma cópia.</div>
</div>
<div id="modalBackdrop" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><form id="postForm" class="modal"><div class="modal-head"><h2 id="modalTitle">Novo post</h2><button class="button icon" type="button" id="closeModal" aria-label="Fechar">×</button></div><div class="modal-body">
  <div class="field full"><label for="title">Título ou ideia central</label><input id="title" maxlength="120" placeholder="Ex.: 3 erros que atrasam o crescimento da sua empresa" required></div>
  <div class="field"><label for="date">Data</label><input id="date" type="date" required></div><div class="field"><label for="time">Horário previsto</label><input id="time" type="time" value="18:00"></div>
  <div class="field"><label for="format">Formato</label><select id="format"><option>Carrossel</option><option>Reels</option><option>Feed 4:5</option><option>Feed 1:1</option><option>Stories</option></select></div><div class="field"><label for="status">Status</label><select id="status"></select></div>
  <div class="field full"><label for="caption">Legenda</label><textarea id="caption" placeholder="Escreva ou cole a legenda do post…"></textarea></div>
  <div class="field full"><label>Imagens e vídeos</label><label class="upload-box" for="mediaFiles"><span class="upload-icon">＋</span><span class="upload-copy"><strong>Adicionar imagens ou vídeos</strong><span>Selecione um ou mais arquivos do seu dispositivo</span></span></label><input id="mediaFiles" type="file" accept="image/*,video/*" multiple class="hidden"><div id="mediaList" class="media-list"></div><div id="mediaEmpty" class="media-empty">Nenhum arquivo anexado.</div></div>
  <div class="field full"><label for="notes">Notas de produção</label><textarea id="notes" style="min-height:74px" placeholder="Referências, próximos passos, observações…"></textarea></div>
 </div><div class="modal-foot"><button id="deleteBtn" class="button ghost hidden" type="button" style="color:#ff8181">Excluir post</button><div style="margin-left:auto;display:flex;gap:8px"><button type="button" id="cancelBtn" class="button ghost">Cancelar</button><button type="submit" class="button primary">Salvar post</button></div></div></form></div>
<div id="toast" class="toast" role="status"></div>
<script>
(()=>{
  const STATUSES=[['Em produção','#ffd166'],['Fazer alteração','#ff9f58'],['Corrigir','#ff7272'],['Programar','#71aaff'],['Postado','#5bd4a0']];
  const FORMATS=['Carrossel','Reels','Feed 4:5','Feed 1:1','Stories'];
  const STORE='estudio-social-posts-v1';
  const today=new Date(); let shown=new Date(today.getFullYear(),today.getMonth(),1), posts=load(), editing=null, view='month', mediaFiles=[], mediaUrls=[];
  const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function load(){try{const d=JSON.parse(localStorage.getItem(STORE)||'[]');return Array.isArray(d)?d:[]}catch{return []}}
  function save(){localStorage.setItem(STORE,JSON.stringify(posts));render();}
  function openMediaDb(){return new Promise((resolve,reject)=>{const req=indexedDB.open('estudio-social-media-v1',1);req.onupgradeneeded=()=>req.result.createObjectStore('posts');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
  async function storeMedia(id,files){const db=await openMediaDb();return new Promise((resolve,reject)=>{const tx=db.transaction('posts','readwrite');tx.objectStore('posts').put(files,id);tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>{db.close();reject(tx.error)}})}
  async function getMedia(id){const db=await openMediaDb();return new Promise((resolve,reject)=>{const req=db.transaction('posts').objectStore('posts').get(id);req.onsuccess=()=>{db.close();resolve(req.result||[])};req.onerror=()=>{db.close();reject(req.error)}})}
  async function deleteMedia(id){const db=await openMediaDb();return new Promise(resolve=>{const tx=db.transaction('posts','readwrite');tx.objectStore('posts').delete(id);tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>{db.close();resolve()}})}
  function paintMedia(){mediaUrls.forEach(URL.revokeObjectURL);mediaUrls=[];$('mediaList').innerHTML=mediaFiles.map((f,i)=>{const url=URL.createObjectURL(f.blob);mediaUrls.push(url);const preview=f.type.startsWith('video/')?`<video src="${url}" controls preload="metadata"></video>`:`<img src="${url}" alt="${esc(f.name)}">`;return `<div class="media-item">${preview}<button type="button" class="media-remove" data-remove-media="${i}" aria-label="Remover ${esc(f.name)}">×</button><div class="media-name" title="${esc(f.name)}">${esc(f.name)}</div></div>`}).join('');$('mediaEmpty').classList.toggle('hidden',mediaFiles.length>0)}
  function blobToData(blob){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(r.error);r.readAsDataURL(blob)})}
  function dataToBlob(data){const [head,body]=data.split(',');const mime=head.match(/data:([^;]+)/)?.[1]||'application/octet-stream';const raw=atob(body),bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);return new Blob([bytes],{type:mime})}
  function iso(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
  function filtered(){const q=$('search').value.trim().toLowerCase(),f=$('formatFilter').value;return posts.filter(p=>(!q||`${p.title} ${p.caption} ${p.notes}`.toLowerCase().includes(q))&&(f==='all'||p.format===f))}
  function renderStats(){ $('stats').innerHTML=STATUSES.map(([name,color])=>{const n=posts.filter(p=>p.status===name).length;return `<div class="stat"><div class="stat-label"><i class="dot" style="--tone:${color}"></i>${name}</div><strong>${n}</strong></div>`}).join('') }
  function renderCalendar(){const first=new Date(shown.getFullYear(),shown.getMonth(),1),start=new Date(first);start.setDate(1-first.getDay());$('monthLabel').textContent=new Intl.DateTimeFormat('pt-BR',{month:'long',year:'numeric'}).format(shown);$('calendarGrid').innerHTML=Array.from({length:42},(_,i)=>{const d=new Date(start);d.setDate(start.getDate()+i);const key=iso(d),dayPosts=filtered().filter(p=>p.date===key).sort((a,b)=>(a.time||'').localeCompare(b.time||'')),isToday=key===iso(today);return `<div class="day ${d.getMonth()!==shown.getMonth()?'outside':''} ${isToday?'today':''}"><div class="day-head"><span class="day-number">${d.getDate()}</span><button class="add-day" data-add="${key}" title="Adicionar post">＋</button></div>${dayPosts.slice(0,3).map(p=>`<button class="post-chip" data-edit="${esc(p.id)}" style="--tone:${statusColor(p.status)}"><span class="chip-time">${esc(p.time||'')}</span>${esc(p.title||'Sem título')}</button>`).join('')}${dayPosts.length>3?`<div class="more">+${dayPosts.length-3} outros</div>`:''}</div>`}).join('')}
  function renderBoard(){ $('boardView').innerHTML=STATUSES.map(([name,color])=>{const items=filtered().filter(p=>p.status===name).sort((a,b)=>a.date.localeCompare(b.date));return `<section class="column"><div class="col-head"><span style="display:flex;align-items:center;gap:8px"><i class="dot" style="--tone:${color}"></i>${name}</span><span class="count">${items.length}</span></div>${items.length?items.map(p=>`<article class="kanban-card" data-edit="${esc(p.id)}"><strong>${esc(p.title||'Sem título')}</strong><div class="card-meta"><span>${fmtDate(p.date)} · ${esc(p.time||'')}</span><span class="tag">${esc(p.format)}</span></div></article>`).join(''):'<div class="empty">Sem posts</div>'}</section>`}).join('') }
  function fmtDate(v){if(!v)return '';return new Intl.DateTimeFormat('pt-BR',{day:'2-digit',month:'short'}).format(new Date(v+'T12:00:00'))}
  function statusColor(status){return (STATUSES.find(x=>x[0]===status)||STATUSES[0])[1]}
  function render(){renderStats();renderCalendar();renderBoard()}
  function setView(v){view=v;$('calendarView').classList.toggle('hidden',v!=='month');$('boardView').classList.toggle('hidden',v!=='board');$('monthViewBtn').classList.toggle('active',v==='month');$('boardViewBtn').classList.toggle('active',v==='board')}
  async function openPost(id=null,date=null){editing=id;const p=posts.find(x=>x.id===id);$('postForm').reset();mediaFiles=p?await getMedia(p.id):[];$('status').innerHTML=STATUSES.map(s=>`<option>${s[0]}</option>`).join('');$('modalTitle').textContent=p?'Editar post':'Novo post';$('deleteBtn').classList.toggle('hidden',!p);$('title').value=p?.title||'';$('date').value=p?.date||date||iso(today);$('time').value=p?.time||'18:00';$('format').value=p?.format||FORMATS[0];$('status').value=p?.status||STATUSES[0][0];$('caption').value=p?.caption||'';$('notes').value=p?.notes||'';paintMedia();$('modalBackdrop').classList.remove('hidden');setTimeout(()=>$('title').focus(),30)}
  function close(){ $('modalBackdrop').classList.add('hidden') }
  function toast(msg){$('toast').textContent=msg;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2300)}
  $('status').innerHTML=STATUSES.map(s=>`<option>${s[0]}</option>`).join('');
  $('postForm').addEventListener('submit',async e=>{e.preventDefault();const old=posts.find(p=>p.id===editing),id=editing||crypto.randomUUID();const p={id,title:$('title').value.trim(),date:$('date').value,time:$('time').value,format:$('format').value,status:$('status').value,caption:$('caption').value,notes:$('notes').value,mediaCount:mediaFiles.length,createdAt:old?.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString()};try{await storeMedia(id,mediaFiles)}catch{toast('Não foi possível salvar os anexos. Tente arquivos menores.');return}posts=old?posts.map(x=>x.id===id?p:x):[...posts,p];close();save();toast(old?'Post atualizado':'Post salvo no calendário')});
  $('deleteBtn').addEventListener('click',async()=>{if(editing&&confirm('Excluir este post do calendário?')){await deleteMedia(editing);posts=posts.filter(p=>p.id!==editing);close();save();toast('Post excluído')}});
  $('newPost').onclick=()=>openPost();$('closeModal').onclick=close;$('cancelBtn').onclick=close;$('modalBackdrop').addEventListener('click',e=>{if(e.target===$('modalBackdrop'))close()});document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
  $('prevMonth').onclick=()=>{shown.setMonth(shown.getMonth()-1);render()};$('nextMonth').onclick=()=>{shown.setMonth(shown.getMonth()+1);render()};$('todayBtn').onclick=()=>{shown=new Date(today.getFullYear(),today.getMonth(),1);render()};$('monthViewBtn').onclick=()=>setView('month');$('boardViewBtn').onclick=()=>setView('board');$('search').oninput=render;$('formatFilter').onchange=render;
  $('mediaFiles').addEventListener('change',e=>{const files=Array.from(e.target.files||[]);mediaFiles.push(...files.map(blob=>({name:blob.name,type:blob.type,blob})));e.target.value='';paintMedia()});
  document.addEventListener('click',e=>{const add=e.target.closest('[data-add]'),edit=e.target.closest('[data-edit]'),remove=e.target.closest('[data-remove-media]');if(add)openPost(null,add.dataset.add);if(edit)openPost(edit.dataset.edit);if(remove){mediaFiles.splice(Number(remove.dataset.removeMedia),1);paintMedia()}});
  $('exportBtn').onclick=async()=>{try{const packaged=[];for(const p of posts){const files=await getMedia(p.id);packaged.push({...p,mediaFiles:await Promise.all(files.map(async f=>({name:f.name,type:f.type,data:await blobToData(f.blob)})))})}const blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),posts:packaged})],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`calendario-postagens-${iso(today)}.json`;a.click();URL.revokeObjectURL(a.href);toast('Cópia com posts e anexos exportada')}catch{toast('Não foi possível exportar os anexos')}};
  $('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const raw=JSON.parse(await file.text()),incoming=Array.isArray(raw)?raw:raw.posts;if(!Array.isArray(incoming)||incoming.some(p=>!p.title||!p.date))throw Error();if(!confirm(`Importar ${incoming.length} posts? Posts com o mesmo código serão atualizados.`))return;const map=new Map(posts.map(p=>[p.id,p]));for(const entry of incoming){const p={...entry,id:entry.id||crypto.randomUUID()};if(Array.isArray(p.mediaFiles)){await storeMedia(p.id,p.mediaFiles.filter(f=>f.data).map(f=>({name:f.name,type:f.type,blob:dataToBlob(f.data)})));p.mediaCount=p.mediaFiles.length;delete p.mediaFiles}map.set(p.id,p)}posts=[...map.values()];save();toast(`${incoming.length} posts importados`)}catch{toast('Não foi possível ler esse arquivo de calendário')}finally{e.target.value=''}};
  render();
})();
</script>
</body>
</html>
